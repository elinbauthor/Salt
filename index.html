@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');

.salt{
  --paper:#FCF3E3; --ink:#14303B; --muted:#5A6B70; --line:#EBDFC7;
  --card:#FFFBF2; --go:#0B7C8C; --go-ink:#0A6873; --go-soft:#CFEDEC;
  --flag:#C6381F; --flag-soft:#F8DED8; --watch:#9A6A05; --watch-soft:#F7E7C4;
  --aqua:#3FC7BE; --aqua-deep:#12A6A0; --sun:#F0B429;
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--paper);
  max-width:480px; margin:0 auto; min-height:100vh;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-bottom:76px; position:relative;
}
.salt *{box-sizing:border-box}
.salt h1{font-size:30px; font-weight:600; letter-spacing:-.02em; margin:0}
.salt h2{font-size:13px; font-weight:600; margin:0 0 10px; letter-spacing:.01em}
.salt h3{font-size:17px; font-weight:600; margin:10px 0 2px}
.salt p{margin:0 0 8px; line-height:1.45}
.salt .muted{color:var(--muted)}
.salt .small{font-size:12.5px}
.salt .center{text-align:center}
.salt .pad{padding:18px 16px}
.salt .hero{position:relative; margin:-18px -16px 18px; border-bottom:1px solid var(--line)}
.salt .hero svg{display:block; width:100%; height:auto}
.salt .herotext{position:absolute; top:14px; left:16px}
.salt .herotext h1{font-size:31px; letter-spacing:-.025em; color:#FFF6E6}
.salt .herotext .tag{margin:2px 0 0; font-size:14px; font-weight:500; color:#FFF6E6}
.salt .herotext .sub{margin:2px 0 0; font-size:12px; color:#FFF6E6; max-width:236px; line-height:1.32}

.salt .banner{padding:11px 16px; font-size:13px; line-height:1.4}
.salt .banner.flag{background:var(--flag-soft); color:#A62E19}
.salt .banner.watch{background:var(--watch-soft); color:#7D5504}

.salt .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px}

.salt .btn{background:var(--go); color:#fff; border:0; border-radius:8px; padding:12px 16px;
  font:inherit; font-weight:500; cursor:pointer}
.salt .btn.ghost{background:transparent; color:var(--go-ink); border:1px solid var(--go)}
.salt .btn.wide{display:block; width:100%; margin-top:14px}
.salt .link{background:none; border:0; color:var(--go-ink); font:inherit; font-size:13px; padding:4px 0; cursor:pointer; text-decoration:underline}
.salt .mini{background:var(--go); color:#fff; border:0; border-radius:6px; padding:5px 9px; font:inherit; font-size:12px; cursor:pointer}
.salt .mini.alt{background:transparent; color:var(--muted); border:1px solid var(--line)}
.salt .mini.alt.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.salt .x{background:none; border:0; color:var(--muted); font-size:19px; line-height:1; cursor:pointer; padding:0 4px}
.salt .back{background:none; border:0; font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:0 8px 0 0}
.salt button:focus-visible, .salt input:focus-visible{outline:2px solid var(--go); outline-offset:2px}

.salt .empty{padding:26px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.salt .triplist{list-style:none; padding:0; margin:0}
.salt .tripitem{position:relative}
.salt .delzone{position:absolute; top:9px; right:8px; display:flex; gap:5px; align-items:center; background:var(--card); padding-left:8px}
.salt .delzone .x{font-size:22px}
.salt .mini.danger{background:var(--flag)}
.salt .triprow{display:block; width:100%; text-align:left; padding-right:34px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:13px 14px; margin-bottom:9px; font:inherit; color:inherit; cursor:pointer}
.salt .tname{display:block; font-weight:500; margin-bottom:2px}

.salt .triphead{display:flex; align-items:center; gap:4px; padding:14px 16px 10px; border-bottom:1px solid var(--line)}
.salt .titleinput{font:inherit; font-size:19px; font-weight:600; background:none; border:0; color:inherit; width:100%; padding:0}

.salt label{display:block; margin-bottom:10px}
.salt label span{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px}
.salt input{font:inherit; font-size:15px; background:#fff; border:1px solid var(--line); border-radius:7px;
  padding:9px 10px; width:100%; color:inherit}
.salt .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.salt .seg{display:flex; gap:6px}
.salt .segbtn{flex:1; background:#fff; border:1px solid var(--line); border-radius:7px; padding:9px;
  font:inherit; font-size:14px; color:var(--muted); cursor:pointer}
.salt .segbtn.on{background:var(--ink); border-color:var(--ink); color:#fff}

.salt .bags{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.salt .bagbtn.wide2{grid-column:1 / -1}
.salt .bagbtn{text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px;
  padding:10px; font:inherit; cursor:pointer; color:var(--ink)}
.salt .bagbtn.on{background:var(--ink); border-color:var(--ink); color:#fff}
.salt .bagname{display:block; font-size:14px; font-weight:500}
.salt .bagsub{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.3}
.salt .bagbtn.on .bagsub{color:#CFE3E6}
.salt .segments{margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.salt .seghead{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:6px}
.salt .segrow{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:5px; margin-bottom:6px}
.salt .segrow input{font-size:12.5px; padding:6px 7px}

.salt .demandrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line)}
.salt .demandrow input{width:64px; text-align:center}

.salt .filters{margin-bottom:14px}
.salt .search{margin-bottom:9px}
.salt .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:2px}
.salt .chip{white-space:nowrap; background:#fff; border:1px solid var(--line); border-radius:20px;
  padding:6px 12px; font:inherit; font-size:13px; color:var(--muted); cursor:pointer}
.salt .chip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.salt .toggle{display:flex; align-items:center; gap:8px; margin:0}
.salt .toggle input{width:auto}
.salt .toggle span{margin:0; font-size:12.5px}

.salt .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.salt .tile{display:flex; flex-direction:column}
.salt .tilepic{position:relative; aspect-ratio:3/4; border:1px solid var(--line); border-radius:9px;
  overflow:hidden; padding:0; background:#fff; cursor:pointer}
.salt .tile.on .tilepic{border-color:var(--go); box-shadow:0 0 0 2px var(--go)}
.salt .tilepic img{width:100%; height:100%; object-fit:cover; display:block}
.salt .nopic{display:block; width:100%; height:100%}
.salt .tick{position:absolute; right:5px; bottom:5px; width:22px; height:22px; border-radius:50%;
  background:var(--go); color:#fff; font-size:13px; display:grid; place-items:center}
.salt .tilename{background:none; border:0; padding:5px 2px 0; font:inherit; font-size:11.5px;
  color:var(--muted); text-align:left; line-height:1.3; cursor:pointer}

.salt .covrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.salt .covname{font-weight:500; font-size:14px}
.salt .pill{font-size:11.5px; padding:3px 8px; border-radius:20px; white-space:nowrap}
.salt .pill.ok{background:var(--go-soft); color:#0A5A63}
.salt .pill.tight{background:var(--watch-soft); color:#7D5504}
.salt .pill.short{background:var(--flag-soft); color:#A62E19}

.salt .matrixwrap{overflow-x:auto; margin:0 -14px; padding:0 14px}
.salt .matrix{border-collapse:collapse; font-size:12px; width:100%}
.salt .matrix th, .salt .matrix td{padding:5px 6px; text-align:center; border:1px solid var(--line)}
.salt .matrix thead th{font-weight:500; color:var(--muted); font-size:11px; background:var(--paper)}
.salt .matrix th.stick{position:sticky; left:0; background:var(--card); text-align:left; font-weight:400;
  display:flex; align-items:center; gap:6px; min-width:132px; border-right:1px solid var(--line)}
.salt .matrix th.stick img{width:20px; height:26px; object-fit:cover; border-radius:3px; flex:none}
.salt .matrix th.stick span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.salt .dot{width:16px; height:16px; border-radius:50%; display:inline-block; flex:none}
.salt .matrix .c0{background:var(--flag-soft)}
.salt .matrix .c1{background:var(--watch-soft)}
.salt .matrix .c2{background:var(--go-soft)}
.salt .matrix .c3{background:#9BDFD8}
.salt .matrix .tot{font-weight:600}

.salt .flagrow{display:flex; align-items:center; gap:9px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px}
.salt .pairrow{display:flex; align-items:center; justify-content:space-between; gap:9px; padding:8px 0;
  border-top:1px solid var(--line); font-size:13px}
.salt .pairbtns{display:flex; gap:5px; flex:none}

.salt .linkrow{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.salt .palette{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px}
.salt .swatchrow{display:flex; align-items:center; gap:6px}
.salt .swatch{width:15px; height:15px; border-radius:3px; border:1px solid var(--line)}

.salt .gauge{height:12px; background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden}
.salt .gauge .fill{height:100%; background:linear-gradient(90deg,var(--aqua-deep),var(--aqua)); transition:width .25s ease}
.salt .gauge .fill.over{background:var(--flag)}
.salt .gaugetext{display:flex; align-items:center; gap:8px; margin:8px 0 4px; font-size:15px}

.salt .packrow{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line)}
.salt .packrow.done .pname{text-decoration:line-through; color:var(--muted)}
.salt .packrow img{width:26px; height:34px; object-fit:cover; border-radius:4px; flex:none}
.salt .pname{flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis}
.salt .pname.edit{border:1px solid var(--line); font-size:13.5px; padding:6px 8px}
.salt .vol{width:62px; text-align:center; font-size:13px; padding:6px; flex:none}
.salt .checkbox{width:24px; height:24px; border:1px solid var(--line); background:#fff; border-radius:6px;
  color:var(--go); font-size:14px; cursor:pointer; flex:none; padding:0}

.salt .tabs{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:grid;
  grid-template-columns:repeat(4,1fr); background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.salt .tab{background:none; border:0; padding:14px 0; font:inherit; font-size:13px; color:var(--muted); cursor:pointer}
.salt .tab.on{color:var(--ink); font-weight:600; box-shadow:inset 0 2px 0 var(--go)}

.salt .sheet{position:fixed; inset:0; background:rgba(20,48,59,.55); display:grid; place-items:center; padding:20px; z-index:20}
.salt .sheetcard{background:var(--card); border-radius:12px; padding:16px; max-width:340px; width:100%}
.salt .sheetcard img{width:100%; max-height:300px; object-fit:contain; border-radius:8px; background:#fff}

@media (prefers-reduced-motion: reduce){ .salt *{transition:none !important} }
